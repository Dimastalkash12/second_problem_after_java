version: "3.9"
services:
  web:
    build: .
    container_name: Flask_app
    ports:
      - "5000:5000"
    volumes:
      - ./app:/app
    depends_on:
      - postgres
    env_file:
      - .env

  postgres:
    image: postgres:17
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_DB: flask_db
      POSTGRES_USER: flask_user
      POSTGRES_PASSWORD: secret_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
volumes:
  postgres_data: